[package]
name = "spawns-core"
version = "1.1.1"
readme.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
description = "Async runtime agnostic thread context task spawner for Rust"

[features]
default = []
compat = []
tokio = ["dep:tokio"]
smol = ["dep:smol"]
async-global-executor = ["dep:async-global-executor"]
panic-multiple-global-spawners = []
test-compat-global1 = ["compat"]
test-compat-global2 = ["compat", "test-compat-global1"]
test-named-global = []

[dependencies]
smol = { version = "2.0.0", optional = true }
tokio = { version = "1", features = ["rt"], optional = true }
async-global-executor = { version =  "2", optional = true }

[dev-dependencies]
futures = "0.3.30"
static_assertions = "1.1.0"

[package.metadata.docs.rs]
all-features = true
